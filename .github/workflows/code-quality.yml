name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore Core dependencies
      run: dotnet restore src/ImpactTrace.Core/ImpactTrace.Core.csproj
      
    - name: Restore Infrastructure dependencies
      run: dotnet restore src/ImpactTrace.Infrastructure/ImpactTrace.Infrastructure.csproj
      
    - name: Check code formatting (Core)
      run: dotnet format src/ImpactTrace.Core/ImpactTrace.Core.csproj --verify-no-changes --verbosity diagnostic
      
    - name: Check code formatting (Infrastructure)
      run: dotnet format src/ImpactTrace.Infrastructure/ImpactTrace.Infrastructure.csproj --verify-no-changes --verbosity diagnostic
      
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: format-check
    
    strategy:
      matrix:
        configuration: [Debug, Release]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore Core dependencies
      run: dotnet restore src/ImpactTrace.Core/ImpactTrace.Core.csproj
      
    - name: Restore Infrastructure dependencies
      run: dotnet restore src/ImpactTrace.Infrastructure/ImpactTrace.Infrastructure.csproj
      
    - name: Build Core
      run: dotnet build src/ImpactTrace.Core/ImpactTrace.Core.csproj --configuration ${{ matrix.configuration }} --no-restore /p:TreatWarningsAsErrors=true
      
    - name: Build Infrastructure
      run: dotnet build src/ImpactTrace.Infrastructure/ImpactTrace.Infrastructure.csproj --configuration ${{ matrix.configuration }} --no-restore /p:TreatWarningsAsErrors=true
      
    - name: Test Core
      run: dotnet test src/ImpactTrace.Core/ImpactTrace.Core.csproj --configuration ${{ matrix.configuration }} --no-build --verbosity normal --logger "trx;LogFileName=test-results-core.trx" || echo "No tests found in Core project"
      
    - name: Test Infrastructure
      run: dotnet test src/ImpactTrace.Infrastructure/ImpactTrace.Infrastructure.csproj --configuration ${{ matrix.configuration }} --no-build --verbosity normal --logger "trx;LogFileName=test-results-infrastructure.trx" || echo "No tests found in Infrastructure project"
      
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.configuration }}
        path: '**/test-results*.trx'
        if-no-files-found: ignore
        
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    needs: format-check
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore Core dependencies
      run: dotnet restore src/ImpactTrace.Core/ImpactTrace.Core.csproj
      
    - name: Restore Infrastructure dependencies
      run: dotnet restore src/ImpactTrace.Infrastructure/ImpactTrace.Infrastructure.csproj
      
    - name: Run code analysis (Core)
      run: dotnet build src/ImpactTrace.Core/ImpactTrace.Core.csproj --no-restore /p:EnforceCodeStyleInBuild=true /p:TreatWarningsAsErrors=true
      
    - name: Run code analysis (Infrastructure)
      run: dotnet build src/ImpactTrace.Infrastructure/ImpactTrace.Infrastructure.csproj --no-restore /p:EnforceCodeStyleInBuild=true /p:TreatWarningsAsErrors=true
      
    - name: Check analyzer warnings (Core)
      run: dotnet format analyzers src/ImpactTrace.Core/ImpactTrace.Core.csproj --verify-no-changes --verbosity diagnostic
      
    - name: Check analyzer warnings (Infrastructure)
      run: dotnet format analyzers src/ImpactTrace.Infrastructure/ImpactTrace.Infrastructure.csproj --verify-no-changes --verbosity diagnostic
